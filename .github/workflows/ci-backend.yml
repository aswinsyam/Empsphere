name: CI - Backend

on:
  push:
    branches: [ main, chore/cleanup-refactor ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:5.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ping:1})'" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests (authentication concurrent OTP)
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          MONGO_URI: mongodb://localhost:27017
          DATABASE_NAME: empsphere_test
        run: |
          cd backend
          python manage.py test apps.authentication.tests.test_concurrent_otp
